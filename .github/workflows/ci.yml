# Gates every push and PR on the full toolchain: clean install from the
# lockfile, type check, and a production build.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build

  # Required: tests against the PINNED supported evarness version, so an
  # unchanged Studio commit can never start failing because evarness moved.
  # Bump the pin deliberately, as a reviewed change.
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install the pinned supported evarness (with signing extra)
        run: python -m pip install "evarness[sign] @ git+https://github.com/evarness-ai/evarness@fffcef8d809fedf769a638772f68e11db6e7a4a8"
      - run: python -m unittest discover -s tests -p "test_*.py" -v

  # Advisory: the same suite against evarness main — an early warning for
  # future incompatibility, never a gate on Studio's own changes.
  server-evarness-main:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install current evarness main (with signing extra)
        run: python -m pip install "evarness[sign] @ git+https://github.com/evarness-ai/evarness"
      - run: python -m unittest discover -s tests -p "test_*.py" -v
