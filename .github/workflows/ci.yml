# Gates every push and PR on the full toolchain: clean install from the
# lockfile, type check, and a production build.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build

  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the evarness library the server wraps
        run: python -m pip install "evarness @ git+https://github.com/evarness-ai/evarness"
      - run: python -m unittest discover -s tests -p "test_*.py" -v
